<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #0f1320; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #535b6b; }
      .col-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .col-en { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #535b6b; }
      .item { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #0f1320; }
      .item-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #535b6b; }
      .center-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f1320; }
      .center-body { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #535b6b; }
      .price { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
      .tag { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
    </style>
    <linearGradient id="autoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06a88c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06a88c" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="manualBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bf7d1a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#bf7d1a" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#141e32" flood-opacity="0.06"/>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(15,20,30,0.05)"/>
    </pattern>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#06a88c"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#bf7d1a"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#f4f6f9"/>
  <rect width="960" height="640" fill="url(#grid)"/>

  <text x="40" y="44" class="title">部署模式</text>
  <text x="40" y="64" class="subtitle">Deploy Modes · 同一本证书台账，两种交付路径</text>

  <line x1="480" y1="100" x2="480" y2="520" stroke="rgba(15,20,30,0.08)" stroke-width="2" stroke-dasharray="6 4"/>

  <g transform="translate(480, 300)">
    <rect x="-120" y="-80" width="240" height="160" rx="14" fill="#fff" stroke="rgba(106,69,224,0.4)" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="-120" y="-80" width="240" height="6" rx="3" fill="#6a45e0"/>
    <text x="0" y="-48" text-anchor="middle" class="center-title">统一台账</text>
    <text x="0" y="-26" text-anchor="middle" class="center-body">/config YAML</text>
    <text x="0" y="-6" text-anchor="middle" class="center-body">同一证书 · 两种交付</text>
    <line x1="-90" y1="10" x2="90" y2="10" stroke="rgba(15,20,30,0.08)"/>
    <text x="0" y="32" text-anchor="middle" class="center-body">部署能力按证书数量授权</text>
    <text x="0" y="54" text-anchor="middle" class="price" fill="#06a88c">≤10 免费</text>
    <text x="0" y="72" text-anchor="middle" class="price" fill="#6a45e0">≤100 ¥99/年</text>
    <text x="0" y="90" text-anchor="middle" class="price" fill="#6a45e0">101+ ¥499/年</text>
  </g>

  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="380" height="480" rx="16" fill="url(#autoBg)" stroke="#06a88c" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="380" height="6" rx="3" fill="#06a88c"/>
    <g transform="translate(32, 36)">
      <circle cx="20" cy="20" r="18" fill="#fff" stroke="#06a88c" stroke-width="2"/>
      <circle cx="20" cy="20" r="6" fill="#06a88c"/>
      <rect x="17" y="2" width="6" height="8" rx="2" fill="#06a88c"/>
      <rect x="17" y="30" width="6" height="8" rx="2" fill="#06a88c"/>
      <rect x="2" y="17" width="8" height="6" rx="2" fill="#06a88c"/>
      <rect x="30" y="17" width="8" height="6" rx="2" fill="#06a88c"/>
    </g>
    <text x="88" y="52" class="col-title" fill="#06a88c">自动部署</text>
    <text x="88" y="72" class="col-en">auto · 零人工介入</text>
    <g transform="translate(32, 100)">
      <rect x="0" y="0" width="316" height="56" rx="10" fill="#fff" stroke="rgba(6,168,140,0.25)"/>
      <rect x="16" y="16" width="24" height="24" rx="6" fill="rgba(6,168,140,0.12)"/>
      <path d="M22,28 L26,32 L34,22" fill="none" stroke="#06a88c" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="24" class="item">SSH 多机</text>
      <text x="52" y="42" class="item-sub">一台 CertHub 推送到 N 台服务器</text>
      <rect x="0" y="68" width="316" height="56" rx="10" fill="#fff" stroke="rgba(6,168,140,0.25)"/>
      <rect x="16" y="84" width="24" height="24" rx="6" fill="rgba(6,168,140,0.12)"/>
      <path d="M22,96 L26,100 L34,90" fill="none" stroke="#06a88c" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="92" class="item">路径定制</text>
      <text x="52" y="110" class="item-sub">cert / key / fullchain 各自配置</text>
      <rect x="0" y="136" width="316" height="56" rx="10" fill="#fff" stroke="rgba(6,168,140,0.25)"/>
      <rect x="16" y="152" width="24" height="24" rx="6" fill="rgba(6,168,140,0.12)"/>
      <path d="M22,164 L26,168 L34,158" fill="none" stroke="#06a88c" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="160" class="item">nginx reload</text>
      <text x="52" y="178" class="item-sub">部署后自动 reload，无需登录</text>
      <rect x="0" y="204" width="316" height="56" rx="10" fill="#fff" stroke="rgba(6,168,140,0.25)"/>
      <rect x="16" y="220" width="24" height="24" rx="6" fill="rgba(6,168,140,0.12)"/>
      <path d="M22,232 L26,236 L34,226" fill="none" stroke="#06a88c" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="228" class="item">SSH/SCP 自动部署</text>
      <text x="52" y="246" class="item-sub">远端 nginx reload</text>
    </g>
    <g transform="translate(32, 380)">
      <rect x="0" y="0" width="316" height="72" rx="10" fill="#fff" stroke="rgba(15,20,30,0.12)"/>
      <text x="16" y="22" class="item-sub">交付路径</text>
      <rect x="16" y="32" width="72" height="28" rx="5" fill="rgba(6,168,140,0.12)"/>
      <text x="52" y="50" text-anchor="middle" class="tag" fill="#06a88c">CertHub</text>
      <text x="98" y="50" class="item-sub">→</text>
      <rect x="110" y="32" width="56" height="28" rx="5" fill="#eef1f5"/>
      <text x="138" y="50" text-anchor="middle" class="tag">SSH</text>
      <text x="176" y="50" class="item-sub">→</text>
      <rect x="188" y="32" width="56" height="28" rx="5" fill="#eef1f5"/>
      <text x="216" y="50" text-anchor="middle" class="tag">SCP</text>
      <text x="254" y="50" class="item-sub">→</text>
      <text x="270" y="50" class="tag" fill="#06a88c">reload</text>
    </g>
  </g>

  <g transform="translate(540, 96)">
    <rect x="0" y="0" width="380" height="480" rx="16" fill="url(#manualBg)" stroke="#bf7d1a" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="380" height="6" rx="3" fill="#bf7d1a"/>
    <g transform="translate(32, 36)">
      <rect x="6" y="14" width="28" height="22" rx="4" fill="#fff" stroke="#bf7d1a" stroke-width="2"/>
      <path d="M20,8 L20,22 M14,16 L20,10 L26,16" fill="none" stroke="#bf7d1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="88" y="52" class="col-title" fill="#bf7d1a">手动部署</text>
    <text x="88" y="72" class="col-en">manual · 诚实边界</text>
    <g transform="translate(32, 100)">
      <rect x="0" y="0" width="316" height="56" rx="10" fill="#fff" stroke="rgba(191,125,26,0.3)"/>
      <rect x="16" y="16" width="24" height="24" rx="6" fill="rgba(191,125,26,0.12)"/>
      <rect x="20" y="22" width="16" height="12" rx="2" fill="none" stroke="#bf7d1a" stroke-width="1.5"/>
      <text x="52" y="24" class="item">ZIP 下载</text>
      <text x="52" y="42" class="item-sub">cert + key + chain 打包就绪</text>
      <rect x="0" y="68" width="316" height="56" rx="10" fill="#fff" stroke="rgba(191,125,26,0.3)"/>
      <rect x="16" y="84" width="24" height="24" rx="6" fill="rgba(191,125,26,0.12)"/>
      <rect x="19" y="88" width="18" height="14" rx="2" fill="none" stroke="#bf7d1a" stroke-width="1.5"/>
      <line x1="22" y1="93" x2="34" y2="93" stroke="#bf7d1a" stroke-width="1"/>
      <line x1="22" y1="97" x2="30" y2="97" stroke="#bf7d1a" stroke-width="1"/>
      <text x="52" y="92" class="item">控制台上传</text>
      <text x="52" y="110" class="item-sub">云厂商 SSL 证书管理页</text>
      <rect x="0" y="136" width="316" height="56" rx="10" fill="#fff" stroke="rgba(191,125,26,0.3)"/>
      <rect x="16" y="152" width="24" height="24" rx="6" fill="rgba(191,125,26,0.12)"/>
      <circle cx="28" cy="164" r="8" fill="none" stroke="#bf7d1a" stroke-width="1.5"/>
      <text x="52" y="160" class="item">CDN 等人肉入口</text>
      <text x="52" y="178" class="item-sub">无法 SSH 时的降级方案</text>
      <rect x="0" y="204" width="316" height="56" rx="10" fill="#fff" stroke="rgba(191,125,26,0.3)"/>
      <rect x="16" y="220" width="24" height="24" rx="6" fill="rgba(191,125,26,0.12)"/>
      <text x="22" y="236" class="tag" fill="#bf7d1a">!</text>
      <text x="52" y="228" class="item">人工步骤不可省略</text>
      <text x="52" y="246" class="item-sub">续期后需再次上传 · 域名多更繁琐</text>
    </g>
    <g transform="translate(32, 380)">
      <rect x="0" y="0" width="316" height="72" rx="10" fill="#fff" stroke="rgba(15,20,30,0.12)"/>
      <text x="16" y="22" class="item-sub">交付路径</text>
      <rect x="16" y="32" width="72" height="28" rx="5" fill="rgba(191,125,26,0.12)"/>
      <text x="52" y="50" text-anchor="middle" class="tag" fill="#bf7d1a">CertHub</text>
      <text x="98" y="50" class="item-sub">→</text>
      <rect x="110" y="32" width="56" height="28" rx="5" fill="#eef1f5"/>
      <text x="138" y="50" text-anchor="middle" class="tag">ZIP</text>
      <text x="176" y="50" class="item-sub">→</text>
      <rect x="188" y="32" width="72" height="28" rx="5" fill="#eef1f5"/>
      <text x="224" y="50" text-anchor="middle" class="tag">人工</text>
      <text x="270" y="50" class="item-sub">→</text>
      <text x="286" y="50" class="tag" fill="#bf7d1a">CDN</text>
    </g>
  </g>

  <path d="M 420,300 L 360,300" fill="none" stroke="#06a88c" stroke-width="2" marker-end="url(#arrGreen)"/>
  <path d="M 540,300 L 600,300" fill="none" stroke="#bf7d1a" stroke-width="2" marker-end="url(#arrAmber)"/>

  <text x="40" y="596" class="item-sub">绿 = MIT 自动化闭环 · 紫 = 官方付费包档位 · 琥珀 = 无法 SSH 时的手动 ZIP</text>
</svg>
