<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">CertHub 系统架构</title>
  <desc id="desc">一屏架构：控制面、引擎、签发、部署、存储告警</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    ]]></style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafbfd"/>
      <stop offset="100%" stop-color="#f3f5f9"/>
    </linearGradient>
    <linearGradient id="eng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(6,168,140,0.06)"/>
      <stop offset="100%" stop-color="rgba(6,168,140,0.02)"/>
    </linearGradient>
    <linearGradient id="dep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(106,69,224,0.07)"/>
      <stop offset="100%" stop-color="rgba(106,69,224,0.02)"/>
    </linearGradient>
    <filter id="s" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#121826" flood-opacity="0.06"/>
    </filter>
    <marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L7 4 L0 7 Z" fill="#9aa3b5"/>
    </marker>
  </defs>

  <rect width="1120" height="620" fill="url(#bg)"/>

  <!-- ===== Header：只留标题 + 角标，避免与 01 抢行 ===== -->
  <text x="48" y="42" class="sans" font-size="24" font-weight="800" fill="#0f1320">CertHub 系统架构</text>
  <rect x="900" y="20" width="172" height="30" rx="15" fill="#fff" stroke="#e4e0f7" filter="url(#s)"/>
  <circle cx="920" cy="35" r="4" fill="#6a45e0"/>
  <text x="934" y="39" class="sans" font-size="12" font-weight="700" fill="#6a45e0">DEPLOY = 部署层</text>

  <!-- ===== Row 1: Control + Engine（并排，省高度） ===== -->
  <g transform="translate(48, 68)">
    <!-- CONTROL -->
    <text x="0" y="0" class="mono" font-size="11" font-weight="700" fill="#98a0b0">01</text>
    <text x="24" y="0" class="sans" font-size="13" font-weight="700" fill="#0f1320">控制面</text>
    <rect x="0" y="14" width="500" height="100" rx="18" fill="#fff" stroke="#e8ebf0" filter="url(#s)"/>
    <g transform="translate(20, 34)">
      <rect x="0" y="0" width="140" height="56" rx="12" fill="#f5f7fb"/>
      <text x="16" y="24" class="sans" font-size="14" font-weight="800" fill="#0f1320">Web UI</text>
      <text x="16" y="44" class="mono" font-size="12" fill="#8a92a3">:8080</text>
      <rect x="156" y="0" width="140" height="56" rx="12" fill="#f5f7fb"/>
      <text x="172" y="24" class="sans" font-size="14" font-weight="800" fill="#0f1320">REST API</text>
      <text x="172" y="44" class="mono" font-size="12" fill="#8a92a3">JSON</text>
      <rect x="312" y="0" width="148" height="56" rx="12" fill="#f5f7fb"/>
      <text x="328" y="24" class="sans" font-size="14" font-weight="800" fill="#0f1320">Cron</text>
      <text x="328" y="44" class="mono" font-size="12" fill="#8a92a3">daily · 调度</text>
    </g>

    <!-- ENGINE -->
    <text x="524" y="0" class="mono" font-size="11" font-weight="700" fill="#98a0b0">02</text>
    <text x="548" y="0" class="sans" font-size="13" font-weight="700" fill="#0f1320">核心引擎</text>
    <rect x="524" y="14" width="500" height="100" rx="18" fill="url(#eng)" stroke="#bfe8df" filter="url(#s)"/>
    <text x="548" y="48" class="mono" font-size="17" font-weight="700" fill="#0f1320">cert-manager.sh</text>
    <text x="548" y="70" class="sans" font-size="12" fill="#535b6b">统一入口 · 申请 / 续期 / 校验 / 部署</text>
    <g transform="translate(548, 82)">
      <rect x="0" y="0" width="70" height="22" rx="7" fill="#fff" stroke="#c5e8e0"/>
      <text x="35" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#067a66">generate</text>
      <rect x="78" y="0" width="56" height="22" rx="7" fill="#fff" stroke="#c5e8e0"/>
      <text x="106" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#067a66">renew</text>
      <rect x="142" y="0" width="64" height="22" rx="7" fill="#fff" stroke="#c5e8e0"/>
      <text x="174" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#067a66">monitor</text>
      <rect x="214" y="0" width="88" height="22" rx="7" fill="#fff" stroke="#c5e8e0"/>
      <text x="258" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#067a66">verify-chains</text>
      <rect x="310" y="0" width="56" height="22" rx="7" fill="#fff" stroke="#d4c8f5"/>
      <text x="338" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#6a45e0">deploy</text>
    </g>
  </g>

  <line x1="560" y1="196" x2="560" y2="218" stroke="#c5cad6" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== Row 2: Issue + DNS ===== -->
  <g transform="translate(48, 228)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="700" fill="#98a0b0">03</text>
    <text x="24" y="0" class="sans" font-size="13" font-weight="700" fill="#0f1320">ACME 签发</text>
    <text x="524" y="0" class="mono" font-size="11" font-weight="700" fill="#98a0b0">DNS-01</text>
    <text x="580" y="0" class="sans" font-size="13" font-weight="700" fill="#0f1320">校验</text>

    <rect x="0" y="14" width="500" height="88" rx="18" fill="#fff" stroke="#e8ebf0" filter="url(#s)"/>
    <circle cx="44" cy="58" r="20" fill="#e8f7f3"/>
    <text x="44" y="63" text-anchor="middle" class="mono" font-size="11" font-weight="800" fill="#06a88c">LE</text>
    <text x="78" y="52" class="sans" font-size="17" font-weight="800" fill="#0f1320">acme.sh</text>
    <text x="78" y="76" class="sans" font-size="13" fill="#6b7385">Let's Encrypt · 约 90 天一轮</text>

    <rect x="524" y="14" width="500" height="88" rx="18" fill="#fff" stroke="#e8ebf0" filter="url(#s)"/>
    <g transform="translate(548, 36)">
      <rect x="0" y="0" width="132" height="32" rx="10" fill="#f5f7fb"/>
      <text x="66" y="21" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#0f1320">阿里云 DNS</text>
      <rect x="148" y="0" width="132" height="32" rx="10" fill="#f5f7fb"/>
      <text x="214" y="21" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#0f1320">腾讯云 DNS</text>
      <rect x="296" y="0" width="132" height="32" rx="10" fill="#f5f7fb"/>
      <text x="362" y="21" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#0f1320">华为云 DNS</text>
    </g>
    <text x="548" y="88" class="sans" font-size="12" fill="#8a92a3">TXT 自动创建 / 清理 · 泛域名</text>
  </g>

  <line x1="560" y1="344" x2="560" y2="366" stroke="#c5cad6" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== Row 3: Deploy（SSH / ZIP） ===== -->
  <g transform="translate(48, 376)">
    <text x="0" y="0" class="mono" font-size="11" font-weight="800" fill="#b8a6ef">04</text>
    <text x="24" y="0" class="sans" font-size="13" font-weight="800" fill="#6a45e0">部署 · SSH / ZIP</text>

    <rect x="0" y="14" width="1024" height="128" rx="20" fill="url(#dep)" stroke="#d4c8f5" filter="url(#s)"/>

    <!-- auto -->
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="480" height="96" rx="14" fill="#fff" stroke="#d7efe9"/>
      <text x="24" y="30" class="sans" font-size="15" font-weight="800" fill="#06a88c">自动 auto</text>
      <g transform="translate(24, 44)">
        <rect x="0" y="0" width="108" height="28" rx="8" fill="#eef8f5"/>
        <text x="54" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#067a66">SSH / SCP</text>
        <rect x="120" y="0" width="148" height="28" rx="8" fill="#eef8f5"/>
        <text x="194" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#067a66">SSH / SCP</text>
        <rect x="280" y="0" width="80" height="28" rx="8" fill="#eef8f5"/>
        <text x="320" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#067a66">nginx</text>
      </g>
      <text x="24" y="90" class="sans" font-size="12" fill="#6b7385">多机 · SSH 自动部署 · 手动 ZIP</text>
    </g>

    <!-- manual -->
    <g transform="translate(524, 30)">
      <rect x="0" y="0" width="480" height="96" rx="14" fill="#fff" stroke="#f0e2c8"/>
      <text x="24" y="30" class="sans" font-size="15" font-weight="800" fill="#bf7d1a">手动 manual</text>
      <g transform="translate(24, 44)">
        <rect x="0" y="0" width="96" height="28" rx="8" fill="#faf4ea"/>
        <text x="48" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#9a6414">ZIP 打包</text>
        <text x="108" y="19" class="sans" font-size="14" fill="#d0b48a">→</text>
        <rect x="124" y="0" width="96" height="28" rx="8" fill="#faf4ea"/>
        <text x="172" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#9a6414">人工上传</text>
        <text x="232" y="19" class="sans" font-size="14" fill="#d0b48a">→</text>
        <rect x="248" y="0" width="128" height="28" rx="8" fill="#faf4ea"/>
        <text x="312" y="19" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#9a6414">CDN / 控制台</text>
      </g>
      <text x="24" y="90" class="sans" font-size="12" fill="#6b7385">只能人肉上传时的诚实边界</text>
    </g>
  </g>

  <!-- ===== Footer strip ===== -->
  <g transform="translate(48, 536)">
    <rect x="0" y="0" width="328" height="52" rx="14" fill="#fff" stroke="#e8ebf0"/>
    <text x="18" y="22" class="sans" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#98a0b0">STORAGE</text>
    <text x="18" y="40" class="sans" font-size="13" font-weight="600" fill="#0f1320">/config · certs · logs</text>

    <rect x="348" y="0" width="328" height="52" rx="14" fill="#fff" stroke="#e8ebf0"/>
    <text x="366" y="22" class="sans" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#98a0b0">NOTIFY</text>
    <text x="366" y="40" class="sans" font-size="13" font-weight="600" fill="#0f1320">钉钉 · 邮件 · Webhook</text>

    <rect x="696" y="0" width="328" height="52" rx="14" fill="#fff" stroke="#d9dde6" stroke-dasharray="4 3"/>
    <text x="714" y="22" class="sans" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#98a0b0">OPTIONAL</text>
    <text x="714" y="40" class="sans" font-size="13" font-weight="600" fill="#0f1320">Prometheus :9090</text>
  </g>
</svg>
